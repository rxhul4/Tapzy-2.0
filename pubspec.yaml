name: tapzy
description: A new Flutter project.

publish_to: 'none'

version: 1.4.0+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.7
  flutter_plugin_android_lifecycle: ^2.0.34
  animate_gradient: ^0.0.4
  curved_navigation_bar: ^1.0.6
  provider: ^6.1.5+1
  http: ^1.6.0
  flutter_spinkit: ^5.2.2
  pin_code_fields: ^9.4.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.2.0
  share_plus: ^13.1.0
  nfc_manager: ^3.3.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.1
  device_info_plus: ^13.1.0
  upgrader: ^13.3.0
  flutter_colorpicker: ^1.1.0
  google_mlkit_text_recognition: ^0.15.1
  flutter_contacts: ^2.1.0
  camera: ^0.12.0+1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/new_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/data/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins.ttf
    - family: Macaria
      fonts:
        - asset: assets/fonts/Macaria.ttf
